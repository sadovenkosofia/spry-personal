name: backend-deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write   # needed to request the GitHub OIDC token
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check backend/

  deploy:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Debug OIDC claims
        run: |
          curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | python3 -c "import sys,json,base64; t=json.load(sys.stdin)['value'].split('.')[1]; print(json.dumps({k:v for k,v in json.loads(base64.urlsafe_b64decode(t+'='*(-len(t)%4))).items() if k in ('sub','aud','iss','repository','ref')}, indent=2))"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::516387401775:role/github-deploy-backend
          aws-region: eu-central-1
      - run: make deploy-backend
